name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Build clean archive and validate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$env:RELEASE_TAG"
      - name: Publish archive with preserved bilingual release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "$env:RELEASE_TAG" "dist/Schedule-$version-windows-x64.zip" --verify-tag --draft --title "Schedule v$version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
