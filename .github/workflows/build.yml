name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: python scripts/build.py
      - run: python scripts/test_native_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: Schedule-windows-x64
          path: dist/Schedule/
