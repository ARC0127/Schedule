name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: python scripts/build.py
      - run: python scripts/test_native_models.py
      - run: python scripts/test_bluetooth.py
      - run: python scripts/test_batch_assets.py
      - run: python scripts/test_auto_sync.py
      - run: python scripts/test_updates.py
      - run: python scripts/test_analysis.py
      - name: Check shared Windows and Android sync model
        run: python -c "from pathlib import Path; assert all(Path('src/web', n).read_bytes() == Path('mobile/android/assets', n).read_bytes() for n in ['sync.js', 'analysis.js'])"
      - uses: actions/upload-artifact@v4
        with:
          name: Schedule-windows-x64
          path: dist/Schedule/
